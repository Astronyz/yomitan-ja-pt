name: Release
on:
  push:
    tags: ['v*.*.*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/build.py --public --dist dist
      - uses: softprops/action-gh-release@v2
        with:
          # não marcar como prerelease: releases/latest/download/ (indexUrl do
          # Yomitan) ignora pré-lançamentos; o aviso de v0.x vai no texto
          make_latest: true
          body_path: docs/RELEASE.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.json
